<script>
(()=>{'use strict';
const KEY='forest-familiars-v1';
const species=[
['燭尾狐','火','N','fox','#eeb38f','#f9dcc2','活潑','尾尖燃著小小燭火的狐狸，最喜歡在晨霧裡追逐閃光的種子。牠總把暖暖的尾巴借給怕冷的朋友，遇見陌生人時也會勇敢地先伸出爪子。'],
['暖絨團','火','N','puff','#e6a990','#f5d9b5','撒嬌','像烤棉花糖一樣柔軟的小精靈，生氣時耳朵會冒出溫柔的火星。牠擅長讓沉默的森林重新熱鬧起來，也會偷偷替迷路的小動物照亮回家的路。'],
['熔岩小龍','火','R','dragon','#df997c','#f5c8a4','勇敢','住在溫泉岩洞的小龍，翅膀還不夠大，卻總想飛到最高的樹梢。牠收藏漂亮的火山石，認為每一顆石頭都記錄著森林曾經發生的故事。'],
['焰冠獅靈','火','SR','lion','#dba078','#f5d0a2','可靠','額前有一圈火焰花冠的獅靈，腳步輕得像落葉，卻能守護整座山谷。牠不喜歡爭吵，總用溫暖的鬃毛安撫受驚的朋友。'],
['泡泡水靈','水','N','blob','#99cbd9','#d6f0ee','好奇','從清晨的第一顆露珠誕生的水靈，身旁總漂浮著圓圓的泡泡。牠喜歡聽雨滴敲打葉片的聲音，偶爾還會把彩虹藏在透明的小口袋裡。'],
['貝殼兔','水','N','bunny','#a6c9df','#e2eff4','害羞','長耳朵像柔軟貝殼的兔子，喜歡在月光下撿拾海浪帶來的玻璃珠。牠說話很小聲，卻會在朋友難過時送上一顆最漂亮的珍珠。'],
['漣漪海鹿','水','R','deer','#8dc1c8','#d4eee9','優雅','腳步踏過的地方會留下淡淡水紋的小鹿，鹿角像珊瑚般輕盈。牠喜歡帶著迷路的魚群尋找溪流，也會替枯萎的花朵送來一場細雨。'],
['月潮鯨靈','水','SR','whale','#83b4d5','#d7e5f5','溫柔','漂浮在林間水霧裡的小鯨靈，唱歌時會出現銀色的浪花。牠相信每個願望都值得被傾聽，因此常在夜裡收集小動物們悄悄說出的心事。'],
['雲絨獸','風','N','puff','#c6d8b1','#f2efd4','慢熟','像一小朵雲的絨毛獸，走路時幾乎不會碰到地面。牠喜歡在微風裡打盹，醒來後會把收集的蒲公英種子送給最先遇見的朋友。'],
['葉耳狐','風','N','fox','#a9c6a4','#e5edc5','機靈','耳朵像嫩葉的狐狸，能聽見樹木低聲交談。牠常替森林傳遞消息，遇到下雨也不急著躲藏，因為牠認為雨聲就是天空寫來的信。'],
['幸運四葉靈','風','R','squirrel','#b3cba6','#f0e5c4','淘氣','由四葉幸運草誕生的小小森林精靈，頭頂長著翠綠葉片，走到哪裡都會留下幸運的微光。牠喜歡把找到的四葉草送給朋友，為每一天帶來一點驚喜。'],
['嵐歌飛鳥','風','SR','bird','#a5c9b7','#e5f1d9','自由','羽翼會映出淡青色光芒的飛鳥，歌聲能讓風停下來傾聽。牠每年都會飛越遠方山嶺，把見過的天空顏色編成歌，唱給森林裡的孩子聽。'],
['閃耳鼠','雷','N','mouse','#e5cf91','#f8ebc6','急性子','小耳朵總冒出微弱電光的圓鼠，跑起來像一顆滾動的星星。牠雖然做事匆忙，卻從不忘記替朋友加油，是森林裡最熱情的小小啦啦隊。'],
['電光球球','雷','N','puff','#e7d49a','#fff2c9','開朗','毛髮蓬鬆得像蒲公英的球球，打噴嚏時會蹦出金色火花。牠最愛和螢火蟲比誰比較亮，輸了也會笑著請大家一起吃甜甜的果實。'],
['雷角羊','雷','R','sheep','#d5c49a','#f2e8c7','固執','羊角像彎彎閃電的魔法羊，總堅持走自己的路。牠最擅長在暴風雨來臨前找到安全的洞穴，並把所有小動物一個個領進溫暖的避風處。'],
['星電貂','雷','SR','ferret','#d8bf8c','#f7e6b7','敏捷','身上有星形電紋的小貂，奔跑時會留下一道細細金光。牠喜歡收集發亮的礦石，總說每一顆石頭裡都藏著還沒被發現的閃電。'],
['曦羽雀','光','R','bird','#f2dbab','#fff6dc','樂觀','羽毛像清晨陽光一樣柔軟的小雀，停在哪裡就能讓花朵微微抬頭。牠相信每個夜晚都會迎來黎明，因此總在天亮前唱出第一首歌。'],
['星輝鹿','光','SR','deer','#ead8b6','#fff7e2','沉穩','鹿角上棲著細小星光的白鹿，總在森林最安靜的時候出現。牠會為徬徨的旅人照亮腳邊的路，卻從不替任何人決定要走向何方。'],
['晨曦聖靈','光','SSR','griffin','#f3d9b0','#fff9e7','慈愛','傳說中從第一縷晨光誕生的聖靈，羽翼灑落的微光能喚醒沉睡的花海。牠只在真誠的願望面前現身，守護著森林裡所有尚未說出口的希望。'],
['影芽蝠','暗','R','bat','#b4a8c9','#e6dced','內向','住在月影花叢的小蝙蝠，翅膀邊緣像柔軟的花瓣。牠害怕吵鬧，卻喜歡在深夜替晚歸的朋友點亮一盞紫色的小燈。'],
['暮霧貓靈','暗','SR','cat','#a69abf','#e0d7e8','神秘','腳掌踏過時會留下紫色霧花的貓靈，眼睛像兩顆安靜的星星。牠喜歡守護被遺忘的故事，也會在有人孤單時默默陪伴，不說一句話。'],
['永夜幻獸','暗','SSR','wolf','#a69aba','#ded5f0','高傲','傳說棲息於星空背面的幻獸，尾巴拖曳著細碎銀河。牠看似冷漠，卻會為最微弱的求救聲穿越長夜，替迷途的靈魂守住最後一點光。']
].map((s,id)=>({id,name:s[0],element:s[1],rarity:s[2],shape:s[3],base:s[4],light:s[5],personality:s[6],story:s[7]}));

let save;try{save={...defaultSave(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{save=defaultSave()};save.owned??={};save.specific??={};save.universal??={N:0,R:0,SR:0,SSR:0};save.form??={};save.seen??={};save.raiseSelected??=null;save.daily??={};save.achievements??={};save.shop??={};let sourceReturn=null;let taskTab="daily",notifyQueue=[],notifyBusy=false;let raiseOnly=false;let dexFilter={rarity:'all',element:'all',status:'all',sort:'default'},dexIndex=null,dexReturn=null;let page='home',modalLocked=false,hatching=false,tutorialIndex=0;let audioCtx=null,musicTimer=null,toastTimer=null;

 {id:'star2',name:'第一次升星',desc:'培育出一隻二星萌寵',kind:'star2',goal:1,reward:{stones:200,universal:{R:2}}},
 {id:'star4',name:'四星的羈絆',desc:'培育出一隻四星萌寵',kind:'star4',goal:1,reward:{stones:350,universal:{SR:2}}},

];
function localDay(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function resetDailyIfNeeded(){let day=localDay();if(save.daily.date===day)return;save.daily={date:day,completed:{},claimed:{},allDoneShown:false};persist()}
function shopClaimedToday(){return save.shop?.lastClaim===localDay()}

return `<div class="eyebrow">THE FOREST COMPENDIUM</div><h1 class="page-title">萌寵圖鑑 ✧</h1><p class="subtitle">每一次相遇，都會為森林的故事添上一頁。</p><section class="dex-progress"><div><div class="eyebrow">COLLECTION PROGRESS</div><h2>已收集 <strong>${total}</strong> / ${species.length} 隻 <span class="dex-percent">${pct}%</span></h2><div class="progress"><div style="width:${pct}%"></div></div></div><span class="dex-book">📖</span></section><div class="dex-toolbar">${opts('稀有度','rarity',[['all','全部稀有度'],['SSR','SSR · 傳說'],['SR','SR · 超稀有'],['R','R · 稀有'],['N','N · 普通']])}${opts('屬性','element',[['all','全部屬性'],...Object.keys(elements).map(x=>[x,`${elements[x]} ${x}`])])}${opts('收集狀態','status',[['all','全部萌寵'],['owned','已獲得'],['locked','尚未發現']])}${opts('排序方式','sort',[['default','稀有度優先'],['element','屬性優先'],['stars','星級優先'],['name','名稱排序']])}</div><div class="dex-count">顯示 ${list.length} 隻萌寵 ${total===22?'<span class="guardian">✦ 森之守護者 ✦</span>':''}</div><div class="dex-grid">${list.map(p=>{let owned=save.owned[p.id],fresh=owned&&!save.seen[p.id];return `<button class="dex-card ${owned?'unlocked':'locked'}" data-dex-open="${p.id}" aria-label="${owned?esc(p.name):'尚未發現的萌寵'}，${p.rarity}，${p.element}">${fresh?'<span class="dex-new">NEW!</span>':''}<span class="dex-card-visual">${owned?svgPet(p,save.form[p.id]==='evolved'&&owned.stars>=5):svgPet(p).replace(/aria-label="[^"]*"/,'aria-label="神祕萌寵"')}</span><span class="dex-card-name">${owned?esc(p.name):'？？？'}</span><span class="dex-tags"><span class="rarity ${p.rarity}">${p.rarity}</span><span>${elements[p.element]} ${p.element}</span></span>${owned?`<span class="dex-stars">${'★'.repeat(owned.stars)}${'☆'.repeat(5-owned.stars)}</span>`:'<span class="dex-unknown">尚未發現</span>'}</button>`}).join('')}</div>${list.length?'':'<div class="dex-empty">🍃 目前沒有符合條件的萌寵，試試其他篩選方式吧。</div>'}`}

const starCosts=[0,2,3,4,5];
function ownedForRaise(){return species.filter(p=>!!save.owned[p.id]).sort((a,b)=>(save.owned[b.id].stars||1)-(save.owned[a.id].stars||1)||rarityOrder[a.rarity]-rarityOrder[b.rarity]||a.id-b.id)}
function raiseResources(p){const o=save.owned[p.id];if(!o)return null;let specific=Number(save.specific[p.id]||0),universal=Number(save.universal[p.rarity]||0),cost=starCosts[o.stars]||0;return {specific,universal,cost,total:specific+universal,can:o.stars<5&&specific+universal>=cost}}
function selectRaise(id){if(!save.owned[id])return;save.raiseSelected=id;markSeen(id);persist();render()}
function raiseHTML(){
 const all=ownedForRaise();
 if(!all.length)return `<div class="eyebrow">COMPANION GROWTH</div><h1 class="page-title">萌寵養成室 ✧</h1><section class="raise-empty"><div style="font-size:66px">🌱</div><h2>森林裡還沒有可以培育的夥伴</h2><p>前往召喚所，與第一隻萌寵相遇吧。</p><button class="primary" data-action="goto" data-target="summon">✧ 前往召喚</button></section>`;
 let selected=save.raiseSelected!=null&&save.owned[save.raiseSelected]?species[save.raiseSelected]:all[0];
 if(save.raiseSelected!==selected.id){save.raiseSelected=selected.id;persist()}
 let o=save.owned[selected.id],res=raiseResources(selected),max=o.stars>=5;
 const cards=all.filter(p=>!raiseOnly||raiseResources(p).can);
 return `<div class="eyebrow">COMPANION GROWTH · MAGIC GARDEN</div><h1 class="page-title">萌寵養成室 ✧</h1><p class="subtitle">用重逢的碎片累積羈絆，讓森林夥伴閃耀成長。</p>
 <div class="raise-layout">
 <section class="raise-list">
 <div class="raise-list-head"><strong>我的萌寵 <span>${all.length} 隻</span></strong><label class="raise-check"><input type="checkbox" data-raise-filter ${raiseOnly?'checked':''}/> 只顯示可升星萌寵</label></div>
 <div class="raise-grid">${cards.map(p=>{let op=save.owned[p.id],rs=raiseResources(p);return `<button class="raise-card ${p.id===selected.id?'selected':''}" data-raise-select="${p.id}" aria-label="${esc(p.name)}，${op.stars}星">${!save.seen[p.id]?'<span class="raise-new">NEW!</span>':''}${rs.can?'<span class="raise-ready" title="可升星">★ 可升星</span>':''}<div class="raise-thumb">${svgPet(p,op.stars>=5&&save.form[p.id]==='evolved')}</div><b>${esc(p.name)}</b><small class="rarity ${p.rarity}">${p.rarity} · ${elements[p.element]} ${p.element}</small><span class="raise-card-stars">${'★'.repeat(op.stars)}${'☆'.repeat(5-op.stars)}</span></button>`}).join('')||'<div class="raise-no-ready">目前沒有可以升星的萌寵。<br>重複召喚可獲得碎片 ✧</div>'}</div>
 </section>
 <section class="raise-stage"><div class="raise-stage-top"><span class="rarity ${selected.rarity}">${selected.rarity} · ${elements[selected.element]} ${selected.element}</span><button class="raise-link" data-action="raiseDex">查看圖鑑 ↗</button></div><h2>${esc(selected.name)}</h2><div class="raise-main-art">${svgPet(selected,max&&save.form[selected.id]==='evolved')}</div><div class="raise-stars">${'★'.repeat(o.stars)}${'☆'.repeat(5-o.stars)}</div>
 ${max?`<div class="raise-max-badge">${dexBadge(selected)}<strong>已達五星 · 進化解鎖！</strong></div>`:`<div class="raise-next">距離 ${o.stars+1} 星還需 <b>${res.cost}</b> 個碎片</div><div class="raise-progress"><div style="width:${Math.min(100,res.total/res.cost*100)}%"></div></div><div class="raise-count">${res.total} / ${res.cost} 個碎片</div>`}
 <div class="raise-fragments"><span>✧ 專屬碎片 <b>${res.specific}</b></span><span>✦ ${selected.rarity} 通用碎片 <b>${res.universal}</b></span></div>
 ${max?`<div class="raise-form-title">選擇展示型態</div><div class="raise-form-grid"><button class="raise-form ${save.form[selected.id]!=='evolved'?'chosen':''}" data-action="raiseForm" data-form="normal">${svgPet(selected)}<span>普通型態</span></button><button class="raise-form ${save.form[selected.id]==='evolved'?'chosen':''}" data-action="raiseForm" data-form="evolved">${svgPet(selected,true)}<span>五星進化型態</span></button></div>`:`<button class="raise-upgrade ${res.can?'ready':''}" data-action="raiseUpgrade">✦ 升星至 ${o.stars+1} 星 ${res.can?'':'· 查看所需碎片'}</button>`}
 </section></div>`;
}
function raiseUpgrade(){
 let id=save.raiseSelected,p=species[id],o=save.owned[id];if(!p||!o)return;
 let r=raiseResources(p);if(o.stars>=5){toast('這隻萌寵已經達到五星！');return}
 if(!r.can){modal(`<div style="font-size:45px">🌱</div><h2>碎片還不夠</h2><p><b>${esc(p.name)}</b> 升到 ${o.stars+1} 星需要 ${r.cost} 個碎片。<br>目前共有 ${r.total} 個，還差 <b>${r.cost-r.total}</b> 個。</p><div class="info-strip">專屬碎片 ${r.specific} · ${p.rarity} 通用碎片 ${r.universal}<br>重複召喚可取得碎片。</div><div class="modal-actions"><button class="secondary" data-action="close">知道了</button><button class="primary" data-action="raiseToSummon">前往召喚</button></div>`);return}
 let takeSpecific=Math.min(r.specific,r.cost),takeUniversal=r.cost-takeSpecific;
 modal(`<div class="eyebrow">STAR ASCENSION</div><div style="font-size:42px">✦</div><h2>確認萌寵升星</h2><div class="raise-confirm-art">${svgPet(p)}</div><h3>${esc(p.name)}</h3><p class="raise-confirm-stars">${'★'.repeat(o.stars)}${'☆'.repeat(5-o.stars)}　→　${'★'.repeat(o.stars+1)}${'☆'.repeat(4-o.stars)}</p><div class="info-strip">優先消耗專屬碎片：<b>${takeSpecific}</b><br>${p.rarity} 通用碎片：<b>${takeUniversal}</b><br>合計：<b>${r.cost}</b> 個</div><div class="modal-actions"><button class="secondary" data-action="close">取消</button><button class="primary" data-action="raiseCommit" data-id="${id}">確認升星 ✦</button></div>`);
}
function raiseCommit(id){
 const p=species[id],o=save.owned[id];if(!p||!o||id!==save.raiseSelected)return;
 const r=raiseResources(p);if(!r?.can)return;
 const take=Math.min(r.specific,r.cost),univ=r.cost-take;
 save.specific[id]=r.specific-take;save.universal[p.rarity]=r.universal-univ;
 o.stars++;const evolved=o.stars===5;if(evolved)save.form[id]='evolved';
 persist();checkAchievements();closeModal(true);render();sound(evolved?'ssr':'pop');
 modal(`<div class="raise-success ${evolved?'raise-evolution':''}"><div class="raise-magic">✦ ✧ ✦</div><div class="raise-success-art">${svgPet(p,evolved)}</div><h2>${evolved?'五星進化成功！':'升星成功！'}</h2><p>${esc(p.name)} 現在是 <b>${o.stars} 星</b> 夥伴了！${evolved?'<br>已自動切換為進化型態，可在養成室切回普通型態。':''}</p><div class="raise-stars">${'★'.repeat(o.stars)}${'☆'.repeat(5-o.stars)}</div><div class="modal-actions"><button class="primary" data-action="raiseSuccessClose">繼續培育 ✧</button></div></div>`,false,true);
}
function raiseForm(form){const id=save.raiseSelected;if(!save.owned[id]||save.owned[id].stars<5)return;save.form[id]=form;persist();render();toast(form==='evolved'?'已切換五星進化型態 ✧':'已切換普通型態 ✧')}
function openDex(id,from='dex'){dexReturn=from;dexIndex=id;markSeen(id);showDexDetail()}
function markSeen(id){if(save.owned[id]&&!save.seen[id]){save.seen[id]=true;persist();updateTop()}}
function formatFirstDate(d){if(!d)return '未知';let date=new Date(d);return isNaN(+date)?'未知':date.toLocaleDateString('zh-TW')}
function dexBadge(p){return `<div class="evolve-badge ${p.rarity.toLowerCase()}"><span>${elements[p.element]}</span><b>★★★★★</b><small>五星進化紀念</small></div>`}
function showDexDetail(){let p=species[dexIndex];if(!p)return;let owned=save.owned[p.id],stars=owned?.stars||0,canEvolve=stars>=5,evolved=canEvolve&&save.form[p.id]==='evolved';let arr=sortedDex();if(!arr.some(x=>x.id===p.id))arr=species;let idx=arr.findIndex(x=>x.id===p.id);let prev=arr[(idx+arr.length-1)%arr.length].id,next=arr[(idx+1)%arr.length].id;
modal(`<div class="dex-detail"><div class="eyebrow">FOREST COMPANION · ${idx+1} / ${arr.length}</div><div class="detail-columns"><div class="detail-left"><div class="detail-visual ${owned?'':'mystery'}" ${owned?'data-detail-pet="1"':''}>${owned?svgPet(p,evolved):svgPet(p).replace(/aria-label="[^"]*"/,'aria-label="神祕萌寵"')}${owned?'<span class="detail-hint">輕點萌寵，讓牠動一動 ✧</span>':''}</div></div><div class="detail-right"><div class="rarity ${p.rarity}">${p.rarity} · ${elements[p.element]} ${p.element}</div><h2>${owned?esc(p.name):'？？？ · 尚未發現'}</h2>${owned?`<div class="detail-stars">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</div><p class="detail-personality">✿ 個性：${esc(p.personality)}</p><div class="detail-story">${esc(p.story)}</div><div class="detail-data"><span>初次相遇<br><b>${formatFirstDate(owned.firstDate)}</b></span><span>專屬碎片<br><b>${save.specific[p.id]||0}</b></span><span>${p.rarity} 通用碎片<br><b>${save.universal[p.rarity]||0}</b></span></div>${canEvolve?dexBadge(p):`<div class="detail-evolution">${stars}/5 星 · ${stars<5?'達到五星即可解鎖進化型態':'進化已解鎖'}</div>`}<div class="detail-forms"><div class="detail-form ${!evolved?'selected':''}">${svgPet(p)}<span>普通型態</span></div><div class="detail-form ${evolved?'selected':''} ${!canEvolve?'form-locked':''}">${svgPet(p,true)}<span>${canEvolve?'進化型態':'🔒 五星解鎖'}</span></div></div><div class="modal-actions"><button class="secondary" data-action="setShowcase" data-id="${p.id}">✧ 設為主城夥伴</button></div>`:`<p>森林中尚未留下牠的足跡。<br>透過魔法召喚，解開這段未知的相遇吧。</p><div class="detail-unknown">🔒 名稱、完整外型、個性與故事尚未解鎖</div>`}</div></div><div class="detail-nav"><button class="secondary" data-action="dexSwitch" data-id="${prev}">← 上一隻</button><button class="primary" data-action="dexClose">返回圖鑑</button><button class="secondary" data-action="dexSwitch" data-id="${next}">下一隻 →</button></div></div>`,true)}
function dexSwitch(id){dexIndex=id;markSeen(id);showDexDetail()}
function modal(content,wide=false,locked=false){modalLocked=locked;document.getElementById('modalRoot').innerHTML=`<div class="modal-shade"><div class="modal ${wide?'wide':''}">${locked?'':'<button class="close" data-action="close" aria-label="關閉">×</button>'}${content}</div></div>`;requestAnimationFrame(fitDetailModal)}
function closeModal(force=false){if(modalLocked&&!force)return;document.getElementById('modalRoot').innerHTML='';modalLocked=false}
function toast(msg){let root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',2600)}
function confirmSummon(n){if(hatching)return;let cost=n===10?900:100;if(save.stones<cost){modal(`<div style="font-size:50px">💎</div><h2>召喚石不足</h2><p>還差 <b>${cost-save.stones}</b> 顆召喚石。<br>可透過每日任務、成就與商店免費禮包取得。</p><div class="modal-actions"><button class="primary" data-action="close">知道了</button><button class="secondary" data-action="source">查看取得方式</button></div>`);return}modal(`<div style="font-size:49px">🥚</div><h2>確認${n===10?'十連':'單次'}召喚</h2><p>將消耗 <b>◆ ${cost}</b> 召喚石，喚醒 ${n} 顆魔法蛋。<br>目前持有 ${save.stones.toLocaleString('zh-TW')} 顆。</p><div class="modal-actions"><button class="secondary" data-action="close">再想想</button><button class="primary" data-action="commit" data-count="${n}">✧ 確認召喚</button></div>`)}
function weightedRarity(first=false,forceSSR=false,forceSR=false){if(forceSSR)return 'SSR';if(first)return Math.random()<.25?'SSR':'SR';let r=Math.random();if(forceSR){return r<.25?'SSR':'SR'}return r<.05?'SSR':r<.2?'SR':r<.55?'R':'N'}
function draw(n){const out=[];let first=save.pulls===0;for(let i=0;i<n;i++){const mustSSR=save.pity>=49;const lastGuarantee=n===10&&i===9&&!out.some(x=>x.p.rarity==='SR'||x.p.rarity==='SSR');let rarity=weightedRarity(first&&i===0,mustSSR,lastGuarantee);let pool=species.filter(p=>p.rarity===rarity);let p=pool[Math.floor(Math.random()*pool.length)];let newSpecies=!save.owned[p.id];let newSSR=p.rarity==='SSR'&&newSpecies;let frag=0,universal=0;if(newSpecies){save.owned[p.id]={stars:1,firstDate:new Date().toISOString()};save.specific[p.id]=0;if(save.showcase===null)save.showcase=p.id}else if(save.owned[p.id].stars>=5){save.universal[p.rarity]=(save.universal[p.rarity]||0)+1;universal=1}else{frag={N:1,R:2,SR:3,SSR:5}[p.rarity];save.specific[p.id]=(save.specific[p.id]||0)+frag}save.pity=rarity==='SSR'?0:save.pity+1;save.pulls++;out.push({p,newSpecies,newSSR,frag,universal})}save.stones-=n===10?900:100;persist();checkAchievements();updateTop();return out}
let hatchState=null;
function startSummon(n){closeModal(true);hatching=true;const results=draw(n);hatchState={results,i:0,phase:'egg',skip:false,ssrQueue:[],ssrIndex:0};showEgg()}
function showEgg(){let h=hatchState;if(h.i>=h.results.length){h.ssrQueue=h.results.filter(x=>x.newSSR);h.ssrIndex=0;return h.ssrQueue.length?showSSR():showSummary()}h.phase='egg';let x=h.results[h.i];modal(`<div class="hatch-counter">魔法蛋 ${h.i+1} / ${h.results.length}</div><div class="hatch-spark">✧ ✦ ✧</div><div class="hatch-egg">🥚</div><h2>魔力正在甦醒…</h2><p>輕觸魔法蛋，揭曉森林的奇遇。</p><div class="modal-actions"><button class="primary" data-action="reveal">✧ 敲開魔法蛋</button>${h.results.length>1?'<button class="secondary" data-action="skipHatch">略過孵化動畫</button>':''}</div>`,false,true);const egg=document.querySelector('.hatch-egg');if(egg)egg.addEventListener('click',()=>reveal()) ;sound('egg')}
function reveal(){let h=hatchState;if(!h||h.phase!=='egg')return;h.phase='reveal';let x=h.results[h.i];sound(x.p.rarity==='SSR'?'ssr':'pop');let r=x.p.rarity;modal(`<div class="hatch-counter">第 ${h.i+1} / ${h.results.length} 次召喚</div><div style="font-size:15px;letter-spacing:6px;color:${rarityColors[r]}">✧ ✦ ✧</div><div class="pet-visual" style="filter:drop-shadow(0 0 17px ${rarityColors[r]}88)">${svgPet(x.p)}</div><div class="rarity ${r}">${r} · ${x.p.element} ${elements[x.p.element]}</div><h2>${esc(x.p.name)} ${x.newSpecies?'<span style="font-size:12px;color:#e08f73">NEW!</span>':''}</h2><p>${x.newSpecies?'新萌寵加入了你的森林！':x.universal?`已達五星，獲得 ${r} 通用碎片 ×1`:`重複召喚，獲得專屬碎片 ×${x.frag}`}</p><div class="modal-actions"><button class="primary" data-action="nextEgg">${h.i===h.results.length-1?'查看召喚結果':'下一顆魔法蛋'} →</button>${h.results.length>1?'<button class="secondary" data-action="skipHatch">略過其餘孵化</button>':''}</div>`,false,true)}
function nextEgg(){if(!hatchState||hatchState.phase!=='reveal')return;hatchState.i++;showEgg()}
function skipHatch(){if(!hatchState)return;hatchState.i=hatchState.results.length;hatchState.ssrQueue=hatchState.results.filter(x=>x.newSSR);hatchState.ssrIndex=0;hatchState.ssrQueue.length?showSSR():showSummary()}
function showSSR(){let h=hatchState;if(h.ssrIndex>=h.ssrQueue.length)return showSummary();h.phase='ssr';let x=h.ssrQueue[h.ssrIndex];sound('ssr');modal(`<div class="celebrate"><div style="font-size:31px;color:#d3ad5c">✦ ✧ ✦</div><div class="pet-visual glow-ssr" style="width:240px;height:240px">${svgPet(x.p)}</div><div class="rarity SSR">SSR · 傳說</div><h2 style="color:#b88a3f">傳說萌寵降臨！</h2><h2>${esc(x.p.name)}</h2><p>森林的星光因你們的相遇而閃耀。<br>這是你首次遇見這位傳說夥伴！</p><div class="modal-actions"><button class="primary" data-action="nextSSR">收藏這份奇蹟 ✧</button></div></div>`,false,true)}
function nextSSR(){hatchState.ssrIndex++;showSSR()}
function showSummary(){let h=hatchState;h.phase='summary';let n=h.results.length;modal(`<div class="eyebrow">SUMMON RESULTS</div><h2>✧ 召喚完成 ✧</h2><p>這次召喚，森林送來了 ${n} 份奇遇。</p><div class="result-grid">${h.results.map(x=>`<div class="result-card ${x.p.rarity.toLowerCase()}">${x.newSpecies?'<span class="newtag">NEW!</span>':''}${svgPet(x.p)}<div class="petname">${esc(x.p.name)}</div><div class="rarity ${x.p.rarity}" style="font-size:11px">${x.p.rarity} · ${x.p.element}</div><div class="extra">${x.newSpecies?'首次獲得':x.universal?`${x.p.rarity}通用碎片 +1`:`專屬碎片 +${x.frag}`}</div></div>`).join('')}</div><div class="modal-actions"><button class="secondary" data-action="endSummon">返回召喚所</button><button class="primary" data-action="resummon" data-count="${n}">再召喚${n===10?'十次':'一次'} ✧</button></div>`,true,true)}
function endSummon(){hatching=false;hatchState=null;closeModal(true);checkAchievements();render();showNextNotice()}
function rates(){modal(`<div class="eyebrow">SUMMONING GUIDE</div><h2>✧ 魔法召喚機率 ✧</h2><p>每次抽取先決定稀有度，再從該稀有度的萌寵中等機率抽選。</p><table class="rate-table"><tr><td class="rarity N">N · 普通</td><td>45%</td></tr><tr><td class="rarity R">R · 稀有</td><td>35%</td></tr><tr><td class="rarity SR">SR · 超稀有</td><td>15%</td></tr><tr><td class="rarity SSR">SSR · 傳說</td><td>5%</td></tr></table><div class="info-strip" style="text-align:left"><b>✦ 十連祝福：</b>每十連至少有一隻 SR 以上。<br><b>✦ SSR 保底：</b>連續 49 抽未出 SSR，第 50 抽必得 SSR；單抽、十連共用計數，抽中 SSR 後歸零。<br><b>✦ 初次祝福：</b>帳號第一次召喚的第一抽，SR 75%／SSR 25%。<br><b>✦ 公平抽選：</b>同稀有度各物種等機率，不因是否已擁有而改變。</div><div class="modal-actions"><button class="primary" data-action="close">我知道了</button></div>`)}
function source(){sourceReturn={page,taskTab,dexFilter:{...dexFilter},scroll:document.getElementById('main')?.scrollTop||0};modal(`<div style="font-size:47px">💎</div><h2>召喚石取得方式</h2><p>讓魔法持續閃耀的三種方式：</p><div class="info-strip" style="text-align:left"><b>☑ 每日任務：</b>完成登入、拜訪圖鑑、拜訪養成室，每天最多獲得 300 顆。<br><b>✦ 一次性成就：</b>達成召喚、收集及升星里程碑獲得獎勵。<br><b>♧ 商店免費禮包：</b>每天領取 200 顆。</div><p class="small">每日任務、成就及商店免費禮包皆已開放。</p><div class="modal-actions"><button class="secondary" data-action="close">關閉</button><button class="primary" data-action="gotoFuture" data-target="tasks">前往任務</button><button class="primary" data-action="gotoFuture" data-target="shop">前往商店</button></div>`)}
function picker(){let ids=Object.keys(save.owned).filter(k=>save.owned[k]);if(!ids.length){toast('還沒有萌寵，先去召喚一位夥伴吧！');return}modal(`<div class="eyebrow">MY COMPANIONS</div><h2>選擇森林夥伴</h2><p>選一位萌寵陪你在魔法森林裡散步。</p><div class="picker-grid">${ids.map(k=>{let p=species[+k];return `<button class="pick-card" data-action="choose" data-id="${k}">${svgPet(p,save.form[k]==='evolved'&&(save.owned[k].stars||1)>=5)}<span>${esc(p.name)}</span><span class="rarity ${p.rarity}">${p.rarity}</span></button>`}).join('')}</div><div class="modal-actions"><button class="secondary" data-action="close">取消</button></div>`,true)}
const talk={活潑:['一起去追閃閃發亮的種子吧！','今天的風聞起來像冒險！'],撒嬌:['可以再陪我一下下嗎？','你的身邊最溫暖了。'],勇敢:['下一座山丘也難不倒我！','有我在，別害怕！'],溫柔:['願今天的微風也溫柔待你。','我把最亮的泡泡送給你。'],神秘:['噓……月光知道一個秘密。','星星剛才偷偷對我眨眼。']};
function interact(){let p=species[save.showcase];if(!p)return;let el=document.getElementById('showcase');el.classList.remove('bounce');void el.offsetWidth;el.classList.add('bounce');let opts=talk[p.personality]||['森林裡的每一天都值得珍惜。','遇見你，是今天最好的魔法。','聽！葉子正在唱歌。'];let s=document.getElementById('speech');s.textContent=opts[Math.floor(Math.random()*opts.length)];s.classList.remove('hidden');setTimeout(()=>s.classList.add('hidden'),3000);sound('pop')}
function settings(){modal(`<div class="eyebrow">FOREST SETTINGS</div><h2>⚙ 森林設定</h2><div class="volume-row"><label>♫ 背景音樂</label><input type="range" min="0" max="100" value="${save.bgm}" data-volume="bgm"><output>${save.bgm}%</output></div><div class="volume-row"><label>✧ 音效</label><input type="range" min="0" max="100" value="${save.sfx}" data-volume="sfx"><output>${save.sfx}%</output></div><p class="small">音樂使用瀏覽器內建音效合成，不需要網路或外部音訊檔案。</p><div class="modal-actions"><button class="secondary" data-action="tutorial">重看新手引導</button><button class="secondary" data-action="reset1">重置遊戲資料</button><button class="primary" data-action="close">完成</button></div>`)}
function reset1(){modal(`<div style="font-size:45px">🍂</div><h2>確定要重置森林嗎？</h2><p>所有萌寵、召喚石、抽卡紀錄及進度都會清除，且無法復原。</p><div class="modal-actions"><button class="secondary" data-action="settings">取消</button><button class="danger" data-action="reset2">繼續重置</button></div>`)}
function reset2(){modal(`<h2>最後一次確認</h2><p>真的要重新開始嗎？重置後將回到 3,000 召喚石、0 隻萌寵的初始狀態。</p><div class="modal-actions"><button class="secondary" data-action="settings">保留進度</button><button class="danger" data-action="resetNow">確定清除所有進度</button></div>`)}
function tutorial(){tutorialIndex=0;showTutorial()}
const steps=[['🌲','歡迎來到魔法森林','在主城裡，你可以與展示的萌寵互動。森林會依照裝置時間變換白天與夜晚。'],['🥚','喚醒第一顆魔法蛋','前往「召喚」頁面，花費 100 召喚石單抽，或花費 900 召喚石進行十連。第一次召喚有 SR／SSR 特別祝福。'],['📖','收藏你的奇遇','新獲得的萌寵會加入圖鑑。你可以查看已獲得的萌寵故事，也能探索尚未發現的神祕剪影。'],['⭐','培育森林夥伴','重複召喚可取得碎片，可在養成室用來升星，五星還會解鎖進化造型。'],['☑','每天都有小禮物','每日任務、成就及商店都已開放，每天可以免費獲得召喚石！']];
function showTutorial(){let s=steps[tutorialIndex];modal(`<div class="tutorial-counter">森林指南 · ${tutorialIndex+1} / ${steps.length}</div><div class="tutorial-icon">${s[0]}</div><h2>${s[1]}</h2><p class="tutorial-body">${s[2]}</p><div class="modal-actions"><button class="secondary" data-action="skipTutorial">略過引導</button><button class="primary" data-action="nextTutorial">${tutorialIndex===steps.length-1?'開始冒險 ✧':'下一步 →'}</button></div>`,false,true)}
function finishTutorial(){save.tutorial=true;persist();closeModal(true);page='home';render()}
// Browser audio playback needs a fresh user gesture after reopening a file.
// Keep the melody scheduler running, and unlock/resume the audio context on interaction.
function resumeForestMusic(){
  if(!save.started||!save.bgm)return;
  ensureAudio();
  if(audioCtx?.state==='suspended')audioCtx.resume().catch(()=>{});
  startMusic();
}
document.addEventListener('pointerdown',resumeForestMusic,{passive:true});
document.addEventListener('keydown',resumeForestMusic);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){resumeForestMusic();resetDailyIfNeeded();updateTop();if(page==='tasks')render()}});
function fitDetailModal(){
  const shade=document.querySelector('.modal-shade');
  const dialog=shade?.querySelector('.modal');
  if(!dialog)return;
  dialog.style.zoom='1';dialog.style.maxHeight='';dialog.style.overflow='';
  if(!dialog.querySelector('.dex-detail'))return;
  dialog.classList.add('detail-full-view');
  const limit=window.innerHeight-30;
  const height=dialog.scrollHeight;
  if(height>limit){
    const scale=Math.max(.48,Math.min(1,limit/height));
    dialog.style.zoom=String(scale);
    dialog.style.maxHeight='none';
    dialog.style.overflow='hidden';
  }
}
window.addEventListener('resize',()=>requestAnimationFrame(fitDetailModal));
function start(){save.started=true;resetDailyIfNeeded();finishDaily('login');checkAchievements();persist();document.getElementById('intro').classList.add('hidden');startMusic();render();if(!save.tutorial)tutorial()}
function ensureAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch{};if(audioCtx?.state==='suspended')audioCtx.resume()}
function tone(freq,duration=.18,volume=.04,type='sine',delay=0){if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(Math.max(.0001,volume),t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}
function sound(kind){if(!save.sfx)return;ensureAudio();let v=save.sfx/100*.06;if(kind==='egg'){tone(410,.15,v);tone(540,.18,v,'sine',0.1)}else if(kind==='ssr'){[523,659,784,1047].forEach((f,i)=>tone(f,.55,v,'sine',i*.13))}else tone(620,.14,v)}
function startMusic(){ensureAudio();if(musicTimer)return;let melody=[392,440,523,440,392,330,349,392,440,523,587,523,440,392,330,349];let idx=0;musicTimer=setInterval(()=>{if(!save.bgm||document.hidden||!audioCtx)return;let v=save.bgm/100*.012;tone(melody[idx%melody.length],.75,v,'sine');if(idx%4===0)tone(melody[idx%melody.length]/2,1.5,v*.5,'sine');idx++},650)}
document.getElementById('sidebar').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(!b||hatching)return;let target=b.dataset.page;if(b.classList.contains('future')){toast('此頁面將在後續階段開放，敬請期待 ✧');return}page=target;if(page==='raise'){raiseOnly=false;finishDaily('raise')}if(page==='dex')finishDaily('dex');if(page==='tasks')taskTab='daily';render();sound('pop')});
document.getElementById('main').addEventListener('click',e=>{if(e.target.closest('#showcase'))return interact();let dc=e.target.closest('[data-dex-open]');if(dc){openDex(+dc.dataset.dexOpen);return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='goto'){page=b.dataset.target;if(page==='raise'){raiseOnly=false;finishDaily('raise')}if(page==='dex')finishDaily('dex');if(page==='tasks')taskTab='daily';render()}if(a==='sourceBack'){if(sourceReturn){page=sourceReturn.page;taskTab=sourceReturn.taskTab;dexFilter={...sourceReturn.dexFilter};render();document.getElementById('main').scrollTop=sourceReturn.scroll;sourceReturn=null}}if(a==='shopClaim')claimShop();if(a==='shopTasks'){page='tasks';taskTab='daily';render()}if(a==='taskTab'){taskTab=b.dataset.tab;render()}if(a==='taskClaim')claimTasks(b.dataset.kind,b.dataset.id);if(a==='taskAll')claimTasks(b.dataset.kind);if(a==='raiseDex')openDex(save.raiseSelected,'raise');if(a==='raiseUpgrade')raiseUpgrade();if(a==='raiseForm')raiseForm(b.dataset.form);if(a==='pick')picker();if(a==='summon')confirmSummon(+b.dataset.count);if(a==='rates')rates()});
document.getElementById('modalRoot').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='sourceBack'){closeModal(true);if(sourceReturn){page=sourceReturn.page;taskTab=sourceReturn.taskTab;dexFilter={...sourceReturn.dexFilter};render();document.getElementById('main').scrollTop=sourceReturn.scroll;sourceReturn=null}}else if(a==='shopRewardClose'){closeModal(true);render()}else if(a==='dexClose'){closeModal(true);page=dexReturn==='raise'?'raise':'dex';render()}else if(a==='dexSwitch')dexSwitch(+b.dataset.id);else if(a==='setShowcase'){save.showcase=+b.dataset.id;persist();closeModal(true);render();toast('已設為主城夥伴 ✧')}else if(a==='taskRewardClose'){closeModal(true);render();showNextNotice()}else if(a==='raiseCommit')raiseCommit(+b.dataset.id);else if(a==='raiseSuccessClose'){closeModal(true);render()}else if(a==='raiseToSummon'){closeModal(true);page='summon';render()}else if(a==='close'){let back=dexReturn==='raise'&&!!document.querySelector('.dex-detail');closeModal();if(back){page='raise';render()}}else if(a==='commit')startSummon(+b.dataset.count);else if(a==='reveal')reveal();else if(a==='nextEgg')nextEgg();else if(a==='skipHatch')skipHatch();else if(a==='nextSSR')nextSSR();else if(a==='endSummon')endSummon();else if(a==='resummon'){let n=+b.dataset.count;endSummon();confirmSummon(n)}else if(a==='choose'){save.showcase=+b.dataset.id;persist();closeModal();render();toast(`${species[save.showcase].name} 來到森林中央陪伴你了！`)}else if(a==='source')source();else if(a==='gotoFuture'){closeModal();page=b.dataset.target;if(page==='tasks')taskTab='daily';render();if(sourceReturn){document.getElementById('main').insertAdjacentHTML('afterbegin',`<button class="source-back" data-action="sourceBack">← 返回${({home:'主城',summon:'召喚',dex:'圖鑑',raise:'養成',tasks:'任務',shop:'商店'})[sourceReturn.page]||'上一頁'}</button>`)}}else if(a==='settings')settings();else if(a==='reset1')reset1();else if(a==='reset2')reset2();else if(a==='resetNow'){save=defaultSave();save.started=true;save.tutorial=true;resetDailyIfNeeded();finishDaily('login');persist();closeModal(true);page='home';render();toast('森林已重新開始，祝你有新的奇遇！')}else if(a==='tutorial')tutorial();else if(a==='nextTutorial'){tutorialIndex++;if(tutorialIndex>=steps.length)finishTutorial();else showTutorial()}else if(a==='skipTutorial')finishTutorial()});
document.getElementById('main').addEventListener('click',e=>{const b=e.target.closest('[data-raise-select]');if(b)selectRaise(+b.dataset.raiseSelect)});document.getElementById('main').addEventListener('change',e=>{if(e.target.matches('[data-raise-filter]')){raiseOnly=e.target.checked;render();return}if(!e.target.matches('[data-dex-filter]'))return;dexFilter[e.target.dataset.dexFilter]=e.target.value;render()});document.getElementById('modalRoot').addEventListener('click',e=>{let v=e.target.closest('[data-detail-pet]');if(!v)return;v.classList.remove('wiggle');void v.offsetWidth;v.classList.add('wiggle');sound('pop')});document.getElementById('modalRoot').addEventListener('input',e=>{if(!e.target.matches('[data-volume]'))return;let k=e.target.dataset.volume;save[k]=+e.target.value;e.target.nextElementSibling.textContent=save[k]+'%';persist();if(k==='bgm'&&save.bgm)startMusic();else if(k==='sfx')sound('pop')});
document.getElementById('currency').addEventListener('click',source);document.getElementById('settingsBtn').addEventListener('click',settings);document.getElementById('startBtn').addEventListener('click',start);if(save.started){resetDailyIfNeeded();finishDaily('login');checkAchievements()}
document.getElementById('introPets').innerHTML=[species[0],species[4],species[17]].map(p=>svgPet(p)).join('');if(!save.started)document.getElementById('intro').classList.remove('hidden');else startMusic();render();setInterval(()=>{if(page==='home'&&!document.querySelector('.modal-shade'))render()},60000);
})();
</script>
</body></html>
